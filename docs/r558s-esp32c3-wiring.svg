fill="white" >2</text><circle cx="130" cy="560" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="151" y="566" font-size="19" fill="white" >1</text><circle cx="130" cy="603" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="151" y="609" font-size="19" fill="white" >0</text><circle cx="305" cy="302" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="285" y="308" font-size="19" fill="#7dd3fc" text-anchor="end" font-weight="700">5</text><circle cx="305" cy="345" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="285" y="351" font-size="19" fill="white" text-anchor="end" >6</text><circle cx="305" cy="388" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="285" y="394" font-size="19" fill="white" text-anchor="end" >7</text><circle cx="305" cy="431" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="285" y="437" font-size="19" fill="white" text-anchor="end" >8</text><circle cx="305" cy="474" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="285" y="480" font-size="19" fill="white" text-anchor="end" >9</text><circle cx="305" cy="517" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="285" y="523" font-size="19" fill="#7dd3fc" text-anchor="end" font-weight="700">10</text><circle cx="305" cy="560" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="285" y="566" font-size="19" fill="white" text-anchor="end" >20</text><circle cx="305" cy="603" r="10" fill="#f7c948" stroke="#9a6c15" stroke-width="2"/><text x="285" y="609" font-size="19" fill="white" text-anchor="end" >21</text><rect x="425" y="145" width="690" height="510" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="450" y="185" font-size="23" fill="#172334" font-weight="700">Провода датчика R558S</text><text x="450" y="214" font-size="15" fill="#64748b" >Цвет</text><text x="640" y="214" font-size="15" fill="#64748b" >Контакт датчика</text><text x="885" y="214" font-size="15" fill="#64748b" >Вывод ESP32</text><line x1="448" y1="284" x2="1089" y2="284" stroke="#e2e8f0"/><rect x="456" y="244" width="27" height="27" rx="5" fill="#e5e7eb" stroke="#94a3b8"/><text x="500" y="265" font-size="19" fill="#172334" >Белый</text><text x="639" y="265" font-size="18" fill="#172334" >VCC_3.3V</text><text x="872" y="265" font-size="18" fill="#0f3965" font-weight="700">3V3</text><line x1="448" y1="345" x2="1089" y2="345" stroke="#e2e8f0"/><rect x="456" y="305" width="27" height="27" rx="5" fill="#16a34a" stroke="none"/><text x="500" y="326" font-size="19" fill="#172334" >Зелёный</text><text x="639" y="326" font-size="18" fill="#172334" >VCC_MCU</text><text x="872" y="326" font-size="18" fill="#0f3965" font-weight="700">3V3</text><line x1="448" y1="406" x2="1089" y2="406" stroke="#e2e8f0"/><rect x="456" y="366" width="27" height="27" rx="5" fill="#dc2626" stroke="none"/><text x="500" y="387" font-size="19" fill="#172334" >Красный</text><text x="639" y="387" font-size="18" fill="#172334" >GND</text><text x="872" y="387" font-size="18" fill="#0f3965" font-weight="700">GND</text><line x1="448" y1="467" x2="1089" y2="467" stroke="#e2e8f0"/><rect x="456" y="427" width="27" height="27" rx="5" fill="#eab308" stroke="none"/><text x="500" y="448" font-size="19" fill="#172334" >Жёлтый</text><text x="639" y="448" font-size="18" fill="#172334" >TX датчика</text><text x="872" y="448" font-size="18" fill="#0f3965" font-weight="700">GPIO4 (RX ESP32)</text><line x1="448" y1="528" x2="1089" y2="528" stroke="#e2e8f0"/><rect x="456" y="488" width="27" height="27" rx="5" fill="#111827" stroke="none"/><text x="500" y="509" font-size="19" fill="#172334" >Чёрный</text><text x="639" y="509" font-size="18" fill="#172334" >RX датчика</text><text x="872" y="509" font-size="18" fill="#0f3965" font-weight="700">GPIO5 (TX ESP32)</text><line x1="448" y1="589" x2="1089" y2="589" stroke="#e2e8f0"/><rect x="456" y="549" width="27" height="27" rx="5" fill="#2563eb" stroke="none"/><text x="500" y="570" font-size="19" fill="#172334" >Синий</text><text x="639" y="570" font-size="18" fill="#172334" >TOUCH_OUT</text><text x="872" y="570" font-size="18" fill="#0f3965" font-weight="700">GPIO3</text><rect x="36" y="683" width="1078" height="72" rx="13" fill="#fff7ed" stroke="#fb923c"/><text x="57" y="713" font-size="18" fill="#9a3412" font-weight="700">Важно: не подключать датчик к 5V. Все соединения выполнять при отключённом USB.</text><text x="57" y="741" font-size="16" fill="#9a3412" >GPIO10 оставить свободным под будущее реле. Перед первым включением проверить 3V3 и GND.</text></g></svg>
<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finger Gate</title>
<style>
body{font:16px system-ui;max-width:650px;margin:40px auto;padding:0 20px;background:#101927;color:#e5eefb}section{border:1px solid #34455e;border-radius:12px;padding:20px;margin:20px 0}label{display:block;margin:12px 0}input,button{font:inherit;padding:10px;border-radius:6px;box-sizing:border-box}input{display:block;width:100%;margin-top:5px}button{cursor:pointer;margin:5px 5px 5px 0;background:#a7d4ff;color:#101927;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a7d4ff}[hidden]{display:none!important}#message{white-space:pre-wrap}
</style>
<h1>Finger Gate</h1>
<p id="message" role="status">Loading secure session…</p>
<section id="loginSection" hidden>
<h2>Administrator login</h2>
<p>First login: admin / admin. You must replace the password before setup.</p>
<form id="login"><label>User<input name="username" autocomplete="username" value="admin" required maxlength="128"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button>Sign in</button></form>
</section>
<section id="passwordSection" hidden>
<h2>Change password</h2><p>12–128 bytes. Changing it signs out all sessions.</p>
<form id="password"><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button>Save password</button></form>
</section>
<section id="adminSection" hidden>
<h2>Device and network</h2><pre id="network"></pre><p id="address"></p>
<button id="refresh">Refresh status</button><button id="finish" hidden>Finish setup and close AP</button>
<div id="wifiSection" hidden><h3>Wi-Fi setup</h3><form id="wifi"><label>SSID<input name="ssid" required maxlength="32"></label><label>Wi-Fi password<input name="password" type="password" autocomplete="off" maxlength="63"></label><button>Connect</button></form></div>
</section>
<button id="logout" hidden>Sign out</button>
<script>
const byId=id=>document.getElementById(id);
let csrf='',pollTimer=0,polls=0;
const message=text=>{byId('message').textContent=text;};
async function api(path,data){const options={credentials:'same-origin',headers:{}};if(data!==undefined){options.method='POST';options.headers={'Content-Type':'application/json','X-CSRF-Token':csrf};options.body=JSON.stringify(data);}const response=await fetch('/api/'+path,options);const value=await response.json();if(!response.ok){if(response.status===401)showLogin();throw Error(value.error||'Request failed');}return value;}
function showLogin(){clearTimeout(pollTimer);csrf='';['passwordSection','adminSection','logout'].forEach(id=>byId(id).hidden=true);byId('loginSection').hidden=false;}
async function showSession(value){csrf=value.csrf;byId('loginSection').hidden=true;byId('logout').hidden=false;byId('passwordSection').hidden=false;byId('adminSection').hidden=value.password_change_required;if(value.password_change_required){message('Replace the default administrator password to continue.');}else{message('Signed in.');await refresh();}}
async function refresh(){const state=await api('status');byId('network').textContent=state.message+'\nSTA IP: '+(state.sta_ip||'not connected')+'\nAP IP: '+(state.ap_ip||'off')+'\nHostname: '+state.hostname+'.local';byId('address').textContent=state.sta_ip?'Administration: https://'+state.sta_ip+'/ or https://'+state.hostname+'.local/':'';byId('finish').hidden=state.state!=='connected'||!state.ap_ip;byId('wifiSection').hidden=!state.ap_ip||state.state==='connected';if(state.state==='connecting'&&polls++<45){pollTimer=setTimeout(()=>refresh().catch(e=>message(e.message)),1000);}else{polls=0;}}
function onForm(id,action){byId(id).onsubmit=async event=>{event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;try{await action(Object.fromEntries(new FormData(event.target)));event.target.reset();}catch(error){message(error.message);}finally{button.disabled=false;}};}
onForm('login',async data=>showSession(await api('login',data)));
onForm('password',async data=>{await api('password',data);showLogin();message('Password saved. Sign in with your new password.');});
onForm('wifi',async data=>{await api('wifi',data);message('Connecting…');clearTimeout(pollTimer);polls=0;await refresh();});
byId('refresh').onclick=()=>refresh().catch(e=>message(e.message));
byId('finish').onclick=async()=>{try{await api('acknowledge',{});clearTimeout(pollTimer);byId('finish').hidden=true;message('Setup complete. AP is closing. Rejoin your local Wi-Fi and open the HTTPS address shown above.');}catch(e){message(e.message);}};
byId('logout').onclick=async()=>{try{await api('logout',{});showLogin();message('Signed out.');}catch(e){message(e.message);}};
api('session').then(showSession).catch(()=>{showLogin();message('Sign in to administer this device.');});
</script>
</html>
